# Disabled on this fork: no release channel here (see README.md).
# Manual dispatch only if a tagged build is needed.
#https://game.ci/docs/github/builder
name: Automated Build
on:
  workflow_dispatch: {}
jobs:
  build:
    name: Build for ${{ matrix.targetPlatform }}
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    strategy:
      fail-fast: false
      matrix:
        targetPlatform:
          #- StandaloneOSX
          #- StandaloneWindows
          - StandaloneWindows64
          #- StandaloneLinux64
    steps:
      - name: Checkout project code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true
      - name: Get version tag
        id: tag_name
        run: |
          echo "SOURCE_TAG=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
      - name: Make build
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          buildName: RESS3D-${{ steps.tag_name.outputs.SOURCE_TAG }}
          targetPlatform: ${{ matrix.targetPlatform }}
      - name: Archive build
        run: zip -qq -r RESS3D-${{ steps.tag_name.outputs.SOURCE_TAG }}.zip build/${{ matrix.targetPlatform }}
        working-directory: /home/runner/work/SS3D/SS3D
      - name: Create release with build archive
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: false
          name: Release ${{ steps.tag_name.outputs.SOURCE_TAG }}
          tag_name: ${{ steps.tag_name.outputs.SOURCE_TAG }}
          files: /home/runner/work/SS3D/SS3D/RESS3D-${{ steps.tag_name.outputs.SOURCE_TAG }}.zip
        env:
          GITHUB_TOKEN: ${{ github.token }}