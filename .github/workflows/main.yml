# DEPRECATED for day-to-day releases: use Develop Release (develop-release.yml) instead —
# EditMode → Linux client+server → multiplayer smoke → GitHub prerelease.
# Kept for optional Windows / legacy experiments only (manual dispatch).
# Requires unity_tests environment secrets (UNITY_LICENSE or UNITY_SERIAL trio).
# versioning: None — fork tags like 0.3.95j break game-ci Semantic versioning.
#https://game.ci/docs/github/builder
name: Automated Build
on:
  workflow_dispatch: {}
jobs:
  build:
    name: Build for ${{ matrix.targetPlatform }}
    runs-on: ubuntu-latest
    environment:
      name: unity_tests
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    strategy:
      fail-fast: false
      matrix:
        targetPlatform:
          #- StandaloneOSX
          #- StandaloneWindows
          - StandaloneWindows64
          #- StandaloneLinux64
    steps:
      - name: Checkout project code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true
      - name: Validate Unity CI secrets
        run: |
          missing=0
          if [ -z "${{ secrets.UNITY_LICENSE }}" ] && [ -z "${{ secrets.UNITY_SERIAL }}" ]; then
            echo "::error::Neither UNITY_LICENSE nor UNITY_SERIAL is set in the unity_tests environment."
            missing=1
          fi
          if [ -n "${{ secrets.UNITY_SERIAL }}" ] && { [ -z "${{ secrets.UNITY_EMAIL }}" ] || [ -z "${{ secrets.UNITY_PASSWORD }}" ]; }; then
            echo "::error::UNITY_SERIAL is set but UNITY_EMAIL or UNITY_PASSWORD is missing."
            missing=1
          fi
          exit $missing
      - name: Get version tag
        id: tag_name
        run: |
          echo "SOURCE_TAG=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          echo "SHORT_SHA=${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"
      - name: Make build
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          buildName: RESS3D-${{ steps.tag_name.outputs.SHORT_SHA }}
          targetPlatform: ${{ matrix.targetPlatform }}
          versioning: None
          unityVersion: 6000.3.16f1
      - name: Archive build
        run: zip -qq -r RESS3D-${{ steps.tag_name.outputs.SHORT_SHA }}.zip build/${{ matrix.targetPlatform }}
      - name: Upload Windows build artifact
        uses: actions/upload-artifact@v4
        with:
          name: RESS3D-Windows-${{ steps.tag_name.outputs.SHORT_SHA }}
          path: RESS3D-${{ steps.tag_name.outputs.SHORT_SHA }}.zip

  build-server:
    name: Build Dedicated Server
    runs-on: ubuntu-latest
    environment:
      name: unity_tests
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout project code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true
      - name: Validate Unity CI secrets
        run: |
          missing=0
          if [ -z "${{ secrets.UNITY_LICENSE }}" ] && [ -z "${{ secrets.UNITY_SERIAL }}" ]; then
            echo "::error::Neither UNITY_LICENSE nor UNITY_SERIAL is set in the unity_tests environment."
            missing=1
          fi
          if [ -n "${{ secrets.UNITY_SERIAL }}" ] && { [ -z "${{ secrets.UNITY_EMAIL }}" ] || [ -z "${{ secrets.UNITY_PASSWORD }}" ]; }; then
            echo "::error::UNITY_SERIAL is set but UNITY_EMAIL or UNITY_PASSWORD is missing."
            missing=1
          fi
          exit $missing
      - name: Get version tag
        id: tag_name
        run: |
          echo "SHORT_SHA=${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"
      - name: Make headless server build
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          buildName: RESS3D-Server-${{ steps.tag_name.outputs.SHORT_SHA }}
          buildsPath: build/GameServer
          targetPlatform: StandaloneLinux64
          buildMethod: SS3D.Editor.ServerBuildScript.BuildServer
          versioning: None
          unityVersion: 6000.3.16f1
      - name: Smoke test - boot the server binary headlessly
        working-directory: ${{ github.workspace }}/build/GameServer/StandaloneLinux64
        run: |
          chmod +x RESS3D-Server-${{ steps.tag_name.outputs.SHORT_SHA }}.x86_64
          timeout 30s ./RESS3D-Server-${{ steps.tag_name.outputs.SHORT_SHA }}.x86_64 \
            -batchmode -nographics -serveronly -port=2222 -logFile server.log || true
          if ! grep -q "Hosting a new headless server" server.log; then
            echo "Server did not report a successful startup, dumping log:"
            cat server.log
            exit 1
          fi
      - name: Upload server build artifact
        uses: actions/upload-artifact@v4
        with:
          name: RESS3D-Server-${{ steps.tag_name.outputs.SHORT_SHA }}
          path: ${{ github.workspace }}/build/GameServer/StandaloneLinux64
