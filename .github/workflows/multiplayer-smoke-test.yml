#https://game.ci/docs/github/builder
# Builds a real headless dedicated-server binary and a real client binary, then runs them
# against each other via Testing/multiplayer/run_smoketest.sh - the actual multiplayer test
# harness. Opt-in for PRs (label test:multiplayer) and manual dispatch. The full gated path
# (EditMode → build → smoke → prerelease) is develop-release.yml — this workflow does not
# auto-run on every develop push (license cost at high merge volume).
#
# See Documents/architecture/2026-07_multiplayer-test-harness.md and
# Documents/architecture/2026-07_ci-develop-release-pipeline.md.
name: Multiplayer Smoke Test
on:
  pull_request:
    types: [labeled, synchronize, opened, reopened]
  workflow_dispatch: {}
jobs:
  multiplayer-smoke-test:
    name: Build and run multiplayer smoke test
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'test:multiplayer')
    runs-on: ubuntu-latest
    environment:
      name: unity_tests
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      SERVER_BUILD_DIR: ${{ github.workspace }}/build/GameServer/StandaloneLinux64
      CLIENT_BUILD_DIR: ${{ github.workspace }}/build/Game/StandaloneLinux64
      # Unity 6 Linux players no longer append .x86_64; game-ci -customBuildPath uses buildName as-is.
      SERVER_BIN_NAME: SS3D-Server
      CLIENT_BIN_NAME: SS3D-Client
    steps:
      - name: Checkout project code
        uses: actions/checkout@v4
        with:
          lfs: true
      - name: Validate Unity CI secrets
        run: |
          missing=0
          if [ -z "${{ secrets.UNITY_LICENSE }}" ] && [ -z "${{ secrets.UNITY_SERIAL }}" ]; then
            echo "::error::Neither UNITY_LICENSE nor UNITY_SERIAL is set in the unity_tests environment."
            missing=1
          fi
          if [ -n "${{ secrets.UNITY_SERIAL }}" ] && { [ -z "${{ secrets.UNITY_EMAIL }}" ] || [ -z "${{ secrets.UNITY_PASSWORD }}" ]; }; then
            echo "::error::UNITY_SERIAL is set but UNITY_EMAIL or UNITY_PASSWORD is missing."
            missing=1
          fi
          exit $missing
      - name: Build dedicated server
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          buildName: SS3D-Server
          buildsPath: build/GameServer
          targetPlatform: StandaloneLinux64
          buildMethod: SS3D.Editor.ServerBuildScript.BuildServer
          versioning: None
          unityVersion: 6000.3.16f1
      - name: Build client
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          buildName: SS3D-Client
          buildsPath: build/Game
          targetPlatform: StandaloneLinux64
          buildMethod: SS3D.Editor.ClientBuildScript.BuildClient
          versioning: None
          unityVersion: 6000.3.16f1
      - name: Run multiplayer smoke tests
        env:
          SS3D_SERVER_BUILD_DIR: ${{ env.SERVER_BUILD_DIR }}
          SS3D_CLIENT_BUILD_DIR: ${{ env.CLIENT_BUILD_DIR }}
          SS3D_SERVER_BIN_NAME: ${{ env.SERVER_BIN_NAME }}
          SS3D_CLIENT_BIN_NAME: ${{ env.CLIENT_BIN_NAME }}
        run: |
          chmod +x "$SERVER_BUILD_DIR/$SERVER_BIN_NAME" "$CLIENT_BUILD_DIR/$CLIENT_BIN_NAME"
          chmod +x Testing/multiplayer/run_smoketest.sh
          ./Testing/multiplayer/run_smoketest.sh basic-round
          ./Testing/multiplayer/run_smoketest.sh late-join 2
      - name: Upload harness logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: multiplayer-smoke-test-logs
          path: Testing/multiplayer/.runs
          if-no-files-found: ignore
          retention-days: 7
