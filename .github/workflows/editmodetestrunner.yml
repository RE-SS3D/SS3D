#https://game.ci/docs/github/test-runner
name: Run Tests
on:
 [push, pull_request_target, workflow_dispatch]
jobs:
  run_tests:
    name: Run tests
    runs-on: ubuntu-latest
    environment:
      name: unity_tests
    steps:
      - name: Checkout project code
        uses: actions/checkout@v3
        with:
          lfs: true
      - name: Setup node
        uses: actions/setup-node@v3
        with:
          node-version: 'lts/*'
      - run: npm install @actions/core
      - run: npm install @actions/github
      - run: npm install jsdom
      - run: npm install fs
      - name: Run tests
        uses: game-ci/unity-test-runner@v4
        with:
          testMode: editmode
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
      - name: Produce summary output
        uses: ./.github/actions/interpret-test-results
        if: always()
        id: interpret-test-results
        with:
          XML_PATH: artifacts/editmode-results.xml
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Test results
          path: artifacts
