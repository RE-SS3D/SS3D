#https://game.ci/docs/github/test-runner
# pull_request (not pull_request_target): checkout and workflow YAML come from the PR head.
# Same-repo PRs still get unity_tests secrets; fork PRs would need a separate trusted path.
name: Run Tests
on:
  push:
    branches: [develop]
  pull_request:
  workflow_dispatch: {}
jobs:
  run_tests:
    name: Run tests
    runs-on: ubuntu-latest
    environment:
      name: unity_tests
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout project code
        uses: actions/checkout@v4
        with:
          lfs: true
          # Explicit PR head (and its repo) so we never silently test the base branch.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
      - name: Validate Unity CI secrets
        run: |
          missing=0
          if [ -z "${{ secrets.UNITY_LICENSE }}" ] && [ -z "${{ secrets.UNITY_SERIAL }}" ]; then
            echo "::error::Neither UNITY_LICENSE nor UNITY_SERIAL is set in the unity_tests environment."
            echo "Personal license: run the Acquire activation file workflow, activate locally, then add UNITY_LICENSE."
            echo "Professional license: set UNITY_SERIAL, UNITY_EMAIL, and UNITY_PASSWORD."
            echo "See https://game.ci/docs/github/activation"
            missing=1
          fi
          if [ -n "${{ secrets.UNITY_SERIAL }}" ] && { [ -z "${{ secrets.UNITY_EMAIL }}" ] || [ -z "${{ secrets.UNITY_PASSWORD }}" ]; }; then
            echo "::error::UNITY_SERIAL is set but UNITY_EMAIL or UNITY_PASSWORD is missing."
            missing=1
          fi
          exit $missing
      - name: Run tests
        id: run-tests
        uses: game-ci/unity-test-runner@v4
        with:
          testMode: editmode
          unityVersion: 6000.3.16f1
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
      - name: Produce summary output
        uses: ./.github/actions/interpret-test-results
        if: success() || failure()
        id: interpret-test-results
        with:
          XML_PATH: artifacts/editmode-results.xml
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Test results
          path: artifacts
