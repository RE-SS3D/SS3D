# Manual EditMode → Linux client/server build → multiplayer smoke → GitHub prerelease.
# Not triggered on every develop merge (license cost + release spam at high PR volume).
# See Documents/architecture/2026-07_ci-develop-release-pipeline.md.
name: Develop Release
on:
  workflow_dispatch:
    inputs:
      skip_release:
        description: Skip GitHub prerelease (run EditMode + build + smoke only)
        type: boolean
        default: false
      tag_suffix:
        description: Override tag suffix (default short SHA). Full tag is develop-<suffix>
        type: string
        default: ''

jobs:
  editmode:
    name: EditMode tests
    runs-on: ubuntu-latest
    environment:
      name: unity_tests
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout project code
        uses: actions/checkout@v4
        with:
          lfs: true
      - name: Validate Unity CI secrets
        run: |
          missing=0
          if [ -z "${{ secrets.UNITY_LICENSE }}" ] && [ -z "${{ secrets.UNITY_SERIAL }}" ]; then
            echo "::error::Neither UNITY_LICENSE nor UNITY_SERIAL is set in the unity_tests environment."
            echo "Personal license: activate locally, then add UNITY_LICENSE to the unity_tests environment."
            echo "Professional license: set UNITY_SERIAL, UNITY_EMAIL, and UNITY_PASSWORD on unity_tests."
            echo "See https://game.ci/docs/github/activation"
            missing=1
          fi
          if [ -n "${{ secrets.UNITY_SERIAL }}" ] && { [ -z "${{ secrets.UNITY_EMAIL }}" ] || [ -z "${{ secrets.UNITY_PASSWORD }}" ]; }; then
            echo "::error::UNITY_SERIAL is set but UNITY_EMAIL or UNITY_PASSWORD is missing."
            missing=1
          fi
          exit $missing
      - name: Run tests
        id: run-tests
        uses: game-ci/unity-test-runner@v4
        with:
          testMode: editmode
          unityVersion: 6000.3.16f1
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
      - name: Produce summary output
        uses: ./.github/actions/interpret-test-results
        if: success() || failure()
        with:
          XML_PATH: artifacts/editmode-results.xml
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: develop-release-editmode-results
          path: artifacts

  build-and-smoke:
    name: Build Linux + multiplayer smoke
    needs: editmode
    runs-on: ubuntu-latest
    environment:
      name: unity_tests
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      SERVER_BUILD_DIR: ${{ github.workspace }}/build/GameServer/StandaloneLinux64
      CLIENT_BUILD_DIR: ${{ github.workspace }}/build/Game/StandaloneLinux64
      SERVER_BIN_NAME: SS3D-Server.x86_64
      CLIENT_BIN_NAME: SS3D-Client.x86_64
    steps:
      - name: Checkout project code
        uses: actions/checkout@v4
        with:
          lfs: true
      - name: Validate Unity CI secrets
        run: |
          missing=0
          if [ -z "${{ secrets.UNITY_LICENSE }}" ] && [ -z "${{ secrets.UNITY_SERIAL }}" ]; then
            echo "::error::Neither UNITY_LICENSE nor UNITY_SERIAL is set in the unity_tests environment."
            missing=1
          fi
          if [ -n "${{ secrets.UNITY_SERIAL }}" ] && { [ -z "${{ secrets.UNITY_EMAIL }}" ] || [ -z "${{ secrets.UNITY_PASSWORD }}" ]; }; then
            echo "::error::UNITY_SERIAL is set but UNITY_EMAIL or UNITY_PASSWORD is missing."
            missing=1
          fi
          exit $missing
      - name: Build dedicated server
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          buildName: SS3D-Server
          buildsPath: build/GameServer
          targetPlatform: StandaloneLinux64
          buildMethod: SS3D.Editor.ServerBuildScript.BuildServer
          versioning: None
          unityVersion: 6000.3.16f1
      - name: Build client
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          buildName: SS3D-Client
          buildsPath: build/Game
          targetPlatform: StandaloneLinux64
          buildMethod: SS3D.Editor.ClientBuildScript.BuildClient
          versioning: None
          unityVersion: 6000.3.16f1
      - name: Run multiplayer smoke tests
        env:
          SS3D_SERVER_BUILD_DIR: ${{ env.SERVER_BUILD_DIR }}
          SS3D_CLIENT_BUILD_DIR: ${{ env.CLIENT_BUILD_DIR }}
          SS3D_SERVER_BIN_NAME: ${{ env.SERVER_BIN_NAME }}
          SS3D_CLIENT_BIN_NAME: ${{ env.CLIENT_BIN_NAME }}
        run: |
          chmod +x "$SERVER_BUILD_DIR/$SERVER_BIN_NAME" "$CLIENT_BUILD_DIR/$CLIENT_BIN_NAME"
          chmod +x Testing/multiplayer/run_smoketest.sh
          ./Testing/multiplayer/run_smoketest.sh basic-round
          ./Testing/multiplayer/run_smoketest.sh late-join 2
      - name: Upload harness logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: develop-release-smoke-logs
          path: Testing/multiplayer/.runs
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload Linux player builds
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: develop-release-linux-builds
          path: build
          retention-days: 7

  release:
    name: GitHub prerelease
    needs: build-and-smoke
    if: ${{ inputs.skip_release != true && inputs.skip_release != 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Resolve release tag
        id: tag
        run: |
          suffix="${{ inputs.tag_suffix }}"
          if [ -z "$suffix" ]; then
            suffix="${GITHUB_SHA:0:7}"
          fi
          echo "tag_name=develop-${suffix}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"
      - name: Download Linux player builds
        uses: actions/download-artifact@v4
        with:
          name: develop-release-linux-builds
          path: build
      - name: Zip client and server
        run: |
          set -euo pipefail
          # Artifact preserves build/GameServer and build/Game from the builder job.
          test -d build/GameServer/StandaloneLinux64
          test -d build/Game/StandaloneLinux64
          mkdir -p dist
          zip -qq -r "dist/SS3D-Linux-Server-${{ steps.tag.outputs.tag_name }}.zip" build/GameServer
          zip -qq -r "dist/SS3D-Linux-Client-${{ steps.tag.outputs.tag_name }}.zip" build/Game
          ls -lh dist
      - name: Create prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag_name }}
          name: Develop ${{ steps.tag.outputs.tag_name }}
          prerelease: true
          generate_release_notes: true
          body: |
            Fork-internal Linux prerelease from `${{ github.sha }}` (short `${{ steps.tag.outputs.short_sha }}`).

            Not an official RE:SS3D build. Artifacts passed EditMode tests and multiplayer smoke
            (`basic-round`, `late-join 2`) in this workflow run.

            - Linux dedicated server: `SS3D-Linux-Server-${{ steps.tag.outputs.tag_name }}.zip`
            - Linux client: `SS3D-Linux-Client-${{ steps.tag.outputs.tag_name }}.zip`
          files: |
            dist/SS3D-Linux-Server-${{ steps.tag.outputs.tag_name }}.zip
            dist/SS3D-Linux-Client-${{ steps.tag.outputs.tag_name }}.zip
        env:
          GITHUB_TOKEN: ${{ github.token }}
