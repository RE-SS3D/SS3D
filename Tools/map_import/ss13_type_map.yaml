# SS13 type path -> SS3D TileObjectSo name. Longest match wins.
# Extend this file as gap reports show frequent unmapped paths.
#
# Pipe kind: so: is a fallback; MapImportPipeResolver overrides from path
# network type (supply→AtmosPipesSupply, scrubbers→AtmosPipesMixed, waste/general/yellow→AtmosPipesWaste)
# or piping_layer 1–4 → Supply, Mixed, Waste, Surface; else Waste.
#
# Wall mounts (APC/lights): MetaStation uses /directional/north|south|east|west path
# suffixes. MapImportDirection parses those; mounts are offset onto the wall tile and
# face into the room. Airlocks without dir infer facing from walls along cardinals
# (scanning through neighbouring doors so multi-door runs orient correctly).

defaults:
  floor: TileGrey
  wall: SteelWall
  window: SteelWindow
  door: CivillianAirlock

prefixes:
  - match: /turf/open/floor/plating
    kind: floor
    so: TilePlating
  - match: /turf/open/floor/iron
    kind: floor
    so: TileGrey
  - match: /turf/open/floor/steel
    kind: floor
    so: TileGrey
  - match: /turf/open/floor/wood
    kind: floor
    so: TileWood
  - match: /turf/open/floor/carpet
    kind: floor
    so: FancyCarpetRed
  - match: /turf/open/floor/grass
    kind: floor
    so: TileGrass
  - match: /turf/open/floor
    kind: floor
    so: TileGrey
  - match: /turf/closed/wall/r_wall
    kind: wall
    so: SteelWallReinforced
  - match: /turf/closed/indestructible
    kind: wall
    so: SteelWallReinforced
  - match: /turf/closed/wall
    kind: wall
    so: SteelWall
  - match: /obj/structure/window/reinforced
    kind: window
    so: SteelWindowReinforced
  - match: /obj/structure/window
    kind: window
    so: SteelWindow
  - match: /turf/closed/wall/mineral/titanium/nodiagonal
    kind: wall
    so: SteelWall
  - match: /obj/machinery/door/airlock/security
    kind: door
    so: SecurityAirlock
  - match: /obj/machinery/door/airlock/public
    kind: door
    so: CivillianAirlock
  - match: /obj/machinery/door/airlock
    kind: door
    so: CivillianAirlock
  - match: /obj/machinery/door/firedoor
    kind: door
    so: CivillianAirlock
  - match: /obj/machinery/door
    kind: door
    so: CivillianAirlock

  # --- Infrastructure (cables / pipes / disposals / fixtures) ---
  - match: /obj/structure/cable
    kind: cable
    so: Cables
  - match: /obj/structure/disposalpipe
    kind: disposal
    so: DisposalPipes
  - match: /obj/structure/disposaloutlet
    kind: disposalterminal
    so: DisposalOutlet
  - match: /obj/machinery/disposal
    kind: disposalterminal
    so: DisposalBin
  - match: /obj/machinery/atmospherics/components/unary/vent_scrubber
    kind: scrubber
    so: Scrubber
  - match: /obj/machinery/atmospherics/components/unary/vent_pump
    kind: vent
    so: Vent
  - match: /obj/machinery/atmospherics/pipe
    kind: pipe
    so: AtmosPipesWaste
  - match: /obj/machinery/power/apc
    kind: apc
    so: APC
  - match: /obj/machinery/light/small
    kind: light
    so: LightBulbFixture
  - match: /obj/machinery/light
    kind: light
    so: LightTubeFixture

  # --- Furniture / exterior walkways ---
  # Lattice/Catwalk are Plenum-layer SOs: import replaces Plenum (space+lattice cells import).
  # Tables: wood → TableWood; all other /obj/structure/table* → TableSteel.
  - match: /obj/structure/lattice/catwalk
    kind: lattice
    so: Catwalk
  - match: /obj/structure/lattice
    kind: lattice
    so: Lattice
  - match: /obj/structure/table/wood
    kind: table
    so: TableWood
  - match: /obj/structure/table
    kind: table
    so: TableSteel
  - match: /obj/machinery/power/smes
    kind: smes
    so: SMES
